    <script src="assets/js/nav.js"></script>
    <script>
        let currentFilter = "全部";
        let currentFilteredList = [];
        let currentModalIndex = -1;

        const filterContainer = document.getElementById('filter-container');
        const gridContainer = document.getElementById('portfolio-grid');
        const modal = document.getElementById('project-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const modalBody = document.getElementById('modal-body');
        const btnCloseModal = document.getElementById('close-modal');
        const btnModalPrev = document.getElementById('modal-prev-btn');
        const btnModalNext = document.getElementById('modal-next-btn');

        // 渲染分類按鈕 (含件數計數標籤)
        function renderFilters() {
            filterContainer.innerHTML = '';
            
            // 計算各類別件數
            const counts = {};
            categories.forEach(cat => {
                counts[cat] = cat === '全部' 
                    ? portfolioData.length 
                    : portfolioData.filter(item => item.category === cat).length;
            });

            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === currentFilter;
                
                btn.className = `text-sm font-medium tracking-wider uppercase transition-all duration-300 pb-1 border-b-2 flex items-center gap-1.5 ${
                    isActive 
                    ? 'text-brand-text border-brand-text font-semibold' 
                    : 'text-gray-400 border-transparent hover:text-brand-text'
                }`;
                
                btn.innerHTML = `<span>${cat}</span><span class="text-xs font-mono ${isActive ? 'text-brand-accent font-bold' : 'text-gray-400'}">(${counts[cat]})</span>`;
                
                btn.onclick = () => {
                    currentFilter = cat;
                    renderFilters();
                    renderGrid();
                };
                
                filterContainer.appendChild(btn);
            });
        }

        // 渲染作品網格 (骨架屏 + Lazy Loading + 高級感卡片設計)
        function renderGrid() {
            gridContainer.innerHTML = '';
            
            currentFilteredList = currentFilter === "全部" 
                ? portfolioData 
                : portfolioData.filter(item => item.category === currentFilter);

            currentFilteredList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'group cursor-pointer flex flex-col fade-in break-inside-avoid mb-8';
                
                let mediaHtml = '';
                if (item.coverType === 'video') {
                    mediaHtml = `
                        <video src="${item.coverThumb}" class="w-full h-auto object-contain rounded-lg transition-transform duration-700 group-hover:scale-105" loop muted playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>
                    `;
                } else if (item.coverType === 'youtube') {
                    mediaHtml = `
                        <div class="relative w-full h-auto object-contain rounded-lg transition-transform duration-700 group-hover:scale-105 overflow-hidden filter grayscale-[20%] group-hover:grayscale-0">
                            <img src="${item.coverThumb}" alt="${item.title}" loading="lazy" decoding="async" class="w-full h-auto opacity-0 transition-opacity duration-500" onload="this.classList.remove('opacity-0'); this.closest('.skeleton-box')?.classList.remove('animate-pulse');">
                            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/10 transition-colors duration-300">
                                <i class="ph ph-play-circle text-5xl text-white drop-shadow-md"></i>
                            </div>
                        </div>
                    `;
                } else {
                    mediaHtml = `
                        <img src="${item.coverThumb}" alt="${item.title}" loading="lazy" decoding="async" class="w-full h-auto object-contain rounded-lg transition-all duration-700 group-hover:scale-105 filter grayscale-[20%] group-hover:grayscale-0 opacity-0" onload="this.classList.remove('opacity-0'); this.closest('.skeleton-box')?.classList.remove('animate-pulse');">
                    `;
                }

                card.innerHTML = `
                    <div class="skeleton-box relative overflow-hidden bg-[#F0EDE6] animate-pulse mb-4 rounded-lg shadow-sm min-h-[160px] flex items-center justify-center">
                        ${mediaHtml}
                        <div class="absolute inset-0 bg-brand-text/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-lg pointer-events-none flex items-center justify-center">
                             <span class="text-white bg-black/50 px-4 py-2 rounded-full text-xs sm:text-sm font-light tracking-widest backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-300 transform translate-y-4 group-hover:translate-y-0">查看作品詳情</span>
                        </div>
                    </div>
                    <div class="px-2">
                        <span class="text-xs font-bold tracking-[0.2em] text-brand-muted uppercase mb-1.5 block">${item.category}</span>
                        <h3 class="text-lg sm:text-xl font-serif font-bold text-brand-text group-hover:text-brand-accent transition-colors">${item.title}</h3>
                    </div>
                `;

                card.onclick = () => openModalByIndex(index);
                gridContainer.appendChild(card);
            });
        }

        // Modal 渲染單一作品 (含設計策略脈絡、計數與大圖)
        function renderModalItem(index) {
            if (index < 0 || index >= currentFilteredList.length) return;
            currentModalIndex = index;
            const item = currentFilteredList[index];
            const counterText = `${index + 1} / ${currentFilteredList.length}`;

            // 設計脈絡與策略區塊 (Context & Role)
            let contextHtml = '';
            if (item.role || item.context) {
                contextHtml = `
                    <div class="max-w-2xl mx-auto my-6 p-5 sm:p-6 bg-[#F8F6F0] rounded-xl border border-gray-200/70 text-left shadow-sm">
                        ${item.role ? `
                            <div class="mb-2.5 flex items-start gap-2">
                                <span class="text-[11px] font-bold tracking-widest text-brand-muted uppercase shrink-0 mt-0.5">ROLE ·</span>
                                <span class="text-sm font-medium text-brand-text">${item.role}</span>
                            </div>
                        ` : ''}
                        ${item.context ? `
                            <div class="flex items-start gap-2">
                                <span class="text-[11px] font-bold tracking-widest text-brand-muted uppercase shrink-0 mt-0.5">CONCEPT ·</span>
                                <p class="text-sm text-gray-600 font-light leading-relaxed">${item.context}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // 媒體大圖列表
            let mediaHtml = '';
            item.items.forEach(media => {
                if (media.type === 'video') {
                    mediaHtml += `<div class="mb-8"><video src="${media.srcFull}" controls autoplay class="inline-block max-w-full max-h-[75vh] w-auto object-contain rounded-xl drop-shadow-md bg-white"></video></div>`;
                } else if (media.type === 'youtube') {
                    mediaHtml += `<div class="mb-8"><iframe src="${media.srcFull}?autoplay=1" allow="autoplay; fullscreen" class="inline-block w-full max-w-4xl aspect-video rounded-xl drop-shadow-md" frameborder="0" allowfullscreen></iframe></div>`;
                } else {
                    mediaHtml += `<div class="mb-8"><img src="${media.srcFull}" alt="${item.title}" class="inline-block max-w-full max-h-[75vh] w-auto object-contain rounded-xl drop-shadow-md bg-white p-2"></div>`;
                }
            });

            modalBody.innerHTML = `
                <div class="mb-6">
                    <div class="flex items-center justify-center gap-3 mb-2">
                        <span class="text-xs font-bold tracking-[0.25em] text-brand-accent uppercase">${item.category}</span>
                        <span class="text-gray-300">·</span>
                        <span class="text-xs font-mono text-brand-muted tracking-wider">${counterText}</span>
                    </div>
                    <h3 class="text-2xl sm:text-4xl font-serif font-bold text-brand-text tracking-wide">${item.title}</h3>
                    <div class="w-10 h-0.5 bg-brand-accent/60 mx-auto mt-4 mb-2"></div>
                </div>
                ${contextHtml}
                <div class="space-y-6 mt-6">
                    ${mediaHtml}
                </div>
                <!-- 底部快捷切換箭頭 -->
                <div class="flex items-center justify-between pt-6 mt-8 border-t border-gray-200/60 text-xs text-brand-muted">
                    <button onclick="navigateModal(-1)" class="hover:text-brand-text flex items-center gap-1.5 transition-colors p-2">
                        <i class="ph ph-arrow-left"></i> 上一件
                    </button>
                    <span class="font-mono text-gray-400">${counterText}</span>
                    <button onclick="navigateModal(1)" class="hover:text-brand-text flex items-center gap-1.5 transition-colors p-2">
                        下一件 <i class="ph ph-arrow-right"></i>
                    </button>
                </div>
            `;

            // 重置彈窗滾動到頂部
            modalContent.scrollTop = 0;
        }

        // 開啟 Modal
        function openModalByIndex(index) {
            renderModalItem(index);
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            document.body.classList.add('modal-open');
        }

        // 切換上一個 / 下一個作品
        function navigateModal(direction) {
            if (!currentFilteredList.length) return;
            const newIndex = (currentModalIndex + direction + currentFilteredList.length) % currentFilteredList.length;
            renderModalItem(newIndex);
        }

        // 關閉 Modal
        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modalBody.innerHTML = ''; // 清除影片停止播放
                document.body.classList.remove('modal-open');
            }, 300);
        }

        // 按鈕事件綁定
        btnModalPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            navigateModal(-1);
        });
        btnModalNext.addEventListener('click', (e) => {
            e.stopPropagation();
            navigateModal(1);
        });
        btnCloseModal.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', closeModal);

        // 鍵盤操作 (← 上一件, → 下一件, Esc 關閉)
        document.addEventListener('keydown', (e) => {
            if (modal.classList.contains('hidden')) return;
            if (e.key === 'ArrowLeft') {
                navigateModal(-1);
            } else if (e.key === 'ArrowRight') {
                navigateModal(1);
            } else if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 手機觸控滑動手勢 (Swipe Left -> 下一件, Swipe Right -> 上一件)
        let touchStartX = 0;
        let touchStartY = 0;
        modalContent.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        modalContent.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].screenX - touchStartX;
            const diffY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX < 0) {
                    navigateModal(1);
                } else {
                    navigateModal(-1);
                }
            }
        }, { passive: true });

        // 初始化
        renderFilters();
        renderGrid();
    </script>
</body>
