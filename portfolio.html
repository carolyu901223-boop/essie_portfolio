<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游佳柔 Essie | Graphic Design Portfolio</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (加入更優雅的字體組合) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- 引入 Phosphor Icons 圖示庫 -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#FDFCF8',      // 溫潤的米白底色
                            text: '#1C1C1C',    // 深邃的黑灰色，比純黑更有質感
                            accent: '#8A84E2',  // 呼應您PDF中的紫色系，但調得更莫蘭迪、更具高級感
                            muted: '#8A8A8A',   // 輔助灰色
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { scroll-behavior: smooth; background-color: #FDFCF8; }
        ::selection { background-color: #8A84E2; color: white; }
        .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        body.modal-open { overflow: hidden; }
        
        /* 訂製細線條滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
    </style>
<title>Portfolio | Essie Yu</title>
<script src="assets/js/data.js"></script>
</head>
<body class="text-brand-text font-sans antialiased min-h-screen flex flex-col">
<header class="fixed top-0 w-full z-40 bg-brand-bg/80 backdrop-blur-md border-b border-gray-100/50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 lg:px-12 py-5 flex justify-between items-center">
            <div class="text-lg font-serif font-bold tracking-widest uppercase">
                Essie Yu<span class="text-brand-accent">.</span>
            </div>
            <nav class="hidden md:flex space-x-10">
                <a href="index.html" class="text-sm font-medium text-brand-muted hover:text-brand-text transition-colors tracking-widest uppercase">Home</a>
                <a href="about.html" class="text-sm font-medium text-brand-muted hover:text-brand-text transition-colors tracking-widest uppercase">About</a>
                <a href="portfolio.html" class="text-sm font-medium text-brand-accent hover:text-brand-text transition-colors tracking-widest uppercase">Portfolio</a>
                <a href="#contact" class="text-sm font-medium text-brand-muted hover:text-brand-text transition-colors tracking-widest uppercase">Contact</a>
            </nav>
            <div class="md:hidden">
                <i class="ph ph-list text-2xl text-brand-text"></i>
            </div>
        </div>
    </header>
<main class="flex-grow pt-24">
<section id="work" class="bg-white py-12 md:py-24 fade-in" style="animation-delay: 0.4s;">
            <div class="max-w-7xl mx-auto px-6 lg:px-12">
                <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-8">
                    <div>
                        <h2 class="text-xs font-bold tracking-[0.2em] text-brand-muted uppercase mb-4">Project Showcase</h2>
                        <h3 class="text-4xl font-serif font-bold">精選作品</h3>
                    </div>
                    
                    <!-- 分類按鈕容器 (雅致的文字連結風格) -->
                    <div id="filter-container" class="flex flex-wrap gap-6">
                        <!-- 動態生成 -->
                    </div>
                </div>

                <!-- 作品網格 -->
                <div id="portfolio-grid" class="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8">
                    <!-- 動態生成 -->
                </div>
            </div>
        </section>
<section id="contact" class="bg-brand-text text-white py-24 lg:py-32">
            <div class="max-w-7xl mx-auto px-6 lg:px-12 grid grid-cols-1 md:grid-cols-2 gap-16">
                <div>
                    <h2 class="text-4xl md:text-5xl font-serif font-bold mb-6">Let's create<br>something great.</h2>
                    <p class="text-gray-400 font-light mb-10 max-w-md">期待與您合作，將想法轉化為有溫度的設計作品，創造更多可能。</p>
                    <a href="mailto:carol.yu901223@gmail.com" class="inline-flex items-center gap-3 bg-white text-brand-text px-8 py-4 rounded-none font-medium hover:bg-gray-200 transition-colors tracking-widest uppercase text-sm">
                        <i class="ph ph-envelope-simple text-lg"></i>
                        Get In Touch
                    </a>
                </div>

                <div class="flex flex-col justify-center space-y-8 md:pl-12 md:border-l border-gray-700">
                    <div>
                        <span class="block text-xs font-bold tracking-[0.2em] text-gray-500 uppercase mb-2">Email</span>
                        <a href="mailto:carol.yu901223@gmail.com" class="text-xl md:text-2xl font-light hover:text-brand-accent transition-colors">carol.yu901223@gmail.com</a>
                    </div>
                    <div>
                        <span class="block text-xs font-bold tracking-[0.2em] text-gray-500 uppercase mb-2">Phone</span>
                        <a href="tel:0900004621" class="text-xl md:text-2xl font-light hover:text-brand-accent transition-colors">0900 004 621</a>
                    </div>
                    <div>
                        <span class="block text-xs font-bold tracking-[0.2em] text-gray-500 uppercase mb-2">Social</span>
                        <div class="flex gap-6 mt-2">
                            <a href="#" class="text-gray-300 hover:text-brand-accent transition-colors flex items-center gap-2">
                                <i class="ph ph-instagram-logo text-2xl"></i>
                                <span class="font-light">@c.j.star</span>
                            </a>
                            <a href="#" class="text-gray-300 hover:text-brand-accent transition-colors flex items-center gap-2">
                                <i class="ph ph-instagram-logo text-2xl"></i>
                                <span class="font-light">@essie_graphic.design</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
</main>
<!-- 彈出視窗 Modal -->
    <div id="project-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 opacity-0 transition-opacity duration-300">
        <div id="modal-backdrop" class="absolute inset-0 bg-brand-text/90 backdrop-blur-md cursor-pointer"></div>
        
        <div id="modal-content" class="relative bg-brand-bg w-full max-w-6xl max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col rounded-xl">
            
            <button id="close-modal" class="fixed top-6 right-6 z-50 bg-white/50 backdrop-blur-md rounded-full p-3 text-brand-text hover:bg-white hover:scale-110 shadow-lg transition-all">
                <i class="ph ph-x text-xl"></i>
            </button>

            <!-- 畫廊區域 -->
            <div id="modal-img-container" class="w-full block text-center px-4 py-16 sm:px-12 space-y-12 relative">
                <!-- Dynamic Media -->
            </div>
        </div>
    </div>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#FDFCF8',      // 溫潤的米白底色
                            text: '#1C1C1C',    // 深邃的黑灰色，比純黑更有質感
                            accent: '#8A84E2',  // 呼應您PDF中的紫色系，但調得更莫蘭迪、更具高級感
                            muted: '#8A8A8A',   // 輔助灰色
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
